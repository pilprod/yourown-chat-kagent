# Desired one-stage delivery contract. Terraform owns these long-lived rails;
# cloudbuild.preview.yaml only creates immutable Releases against them.
apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: kagent-preview
  annotations:
    preview.yourown.chat/source: pilprod-yourown-chat-kagent
serialPipeline:
  stages:
    - targetId: kagent-testbed
      profiles:
        - kagent-testbed
      strategy:
        standard:
          verify: true
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: kagent-testbed
  annotations:
    preview.yourown.chat/scope: non-production
requireApproval: false
gke:
  cluster: projects/yourown-chat/locations/europe-west3-b/clusters/europe-west3-b
